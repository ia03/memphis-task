services:
  electrician:
    join_head: {p_offered: 0.33, price_per_head_egp: [35, 80], minutes_per_head: [8, 20], busy_until_minutes_after_arrival: [0, 120], max_heads_per_day: [4, 15]}
    # Basis: 1 of 3 electricians contacted (Harby Tech) joined a head; the other two were not asked.

channels:
  # Unknown addresses: mostly silent, as in the real run.
  unknown_email: {bounces: 0.15, silent: 0.8, reply_without_quote: 0.05}
  # Basis: 53 emails gave no readable quote; 5 addresses bounced; 10 AI calls gave nothing usable;
  # workers' own calls reached staff in most cases.
  email: {bounces: 0.15, silent: 0.75, reply_without_quote: 0.08, replies: 0.02}
  ai_call: {no_connect: 0.3, busy: 0.3, hangs_up: 0.2, no_answer: 0.15, reaches_staff: 0.05}
  phone_by_worker: {answers: 0.8}
  phone_knowledge: {knows: 0.5, website_only: 0.2, guesses: 0.3}
  signal_inside: 0.85

workspaces:
  # A table for hand work. Basis: worker-b found no table in Manial or Downtown and spent about 39-90 minutes
  # finding a cafe table (ledger D06-08).
  worker_home_has_table: true
  cafe_search_minutes: [25, 90]
  cafe_cost_egp: [20, 60]

