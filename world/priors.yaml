# Priors for shops the record never observed. Workers find these by walking a district and asking.
# Every value here is an assumption; the sensitivity check varies each one. Basis notes cite the record.

walk_in_shops:
  # Expected number of extra walk-in shops of each category per district, beyond the observed ones.
  # Basis: Downtown/Bab El Louk is the electronics hub (Lampatronics, RAM, FEC, Fares within walking distance);
  # Dokki had two electrical shops, a plumbing shop and a phone-accessory shop on two streets.
  # Every residential or market district also has groceries or kiosks, a housewares shop and a hardware shop (agents asked for
  # these in 56 trials); none of them is in the record, so they carry only the category priors below.
  downtown_bab_el_louk: {electronics_retail: 3, electrician: 1, stationery: 1, mobile_accessories: 2, grocery: 2, housewares: 1, plumbing_hardware: 1}
  dokki: {electronics_retail: 1, electrician: 1, stationery: 1, mobile_accessories: 1, grocery: 2, housewares: 1}
  manial: {electrician: 1, stationery: 1, mobile_accessories: 1, grocery: 2, housewares: 1, plumbing_hardware: 1}
  new_maadi: {electrician: 1, stationery: 1, mobile_accessories: 2, grocery: 2, housewares: 1, plumbing_hardware: 1}
  maadi_degla: {electronics_retail: 1, electrician: 1, stationery: 1, mobile_accessories: 2, grocery: 2, housewares: 1, plumbing_hardware: 1}
  hadayek_october: {electrician: 1, mobile_accessories: 1, grocery: 2, housewares: 1, plumbing_hardware: 1}
  abbasiya: {electronics_retail: 3, electrician: 1, mobile_accessories: 1, grocery: 2, housewares: 1, plumbing_hardware: 1}
  sixth_october: {electronics_retail: 1, electrician: 1, stationery: 1, mobile_accessories: 2, grocery: 2, housewares: 1, plumbing_hardware: 1}
  delivery_area: {grocery: 2, housewares: 1}

